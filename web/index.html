<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: "Manrope", system-ui, sans-serif;
        background: var(--bg, #eef1f8);
        color: var(--text, #1a2233);
      }
      input, button, select { font-family: inherit; }
      @keyframes rwspin { to { transform: rotate(360deg); } }
      @keyframes rwbar { 0% { width: 4%; } 80% { width: 92%; } 100% { width: 98%; } }
      @keyframes rwrise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes rwdash { to { stroke-dashoffset: -14; } }
      @keyframes rwping { 0% { transform: scale(.7); opacity: .7; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes rwblink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      /* A figure the contract data doesn't carry. Reads as a blank to fill, and
         clicking one selects it so typing overwrites the whole placeholder. */
      .verify-chip {
        background: color-mix(in srgb, var(--warn) 16%, transparent);
        border: 1px dashed var(--warn);
        border-radius: 5px; padding: 0 5px;
        color: var(--warn); font-weight: 600; font-size: .92em; cursor: text;
      }
      /* Show the document is live: fields lift as the cursor passes over them. */
      .draft-page[contenteditable="true"] td:hover,
      .draft-page[contenteditable="true"] p:hover {
        background: color-mix(in srgb, var(--accent) 7%, transparent);
      }
      @media print {
        body * { visibility: hidden; }
        .verify-chip { background: none; border: none; color: inherit; padding: 0; }
        .draft-page td:hover, .draft-page p:hover { background: none !important; }
        .draft-page, .draft-page * { visibility: visible; }
        .draft-page {
          position: absolute; left: 0; top: 0; width: 100%;
          box-shadow: none !important; border: none !important; padding: 0 !important;
        }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
